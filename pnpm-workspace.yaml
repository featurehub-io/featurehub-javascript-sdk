packages:
  - "packages/*"
  - "examples/*"
  - "plugins/usage/*"
  - "plugins/stores/*"
  - "plugins/interceptors/*"
allowBuilds:
  "@parcel/watcher": false
  "@swc/core": false
  esbuild: false
  protobufjs: false
  unrs-resolver: false

catalogs:
  node:
    "@types/node": "22.18.10"
  prettier:
    prettier: "3.6.2"
  react19:
    "@types/react": "^19.2.2"
    "@types/react-dom": "^19.2.2"
    react: "^19.2.0"
    react-dom: "^19.2.0"
  rimraf:
    rimraf: "6.1.3"
  sinon:
    "@types/sinon": "^21.0.0"
    "sinon": "^21.0.1"
  tsup:
    tsup: "8.5.0"
  typescript:
    typescript: "5.9.3"
  vite:
    vite: "^7.3.8"
  vitest:
    "@vitest/coverage-istanbul": "4.1.12"
    vitest: "^4.1.12"

gitChecks: false

# security fixes with no patched release in the range their dependants ask for
overrides:
  "glob@>=9.0.0 <14.0.2": "^14.0.2"

